<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Products App</title>
    <!-- Use Tailwind CSS for simple, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Live Trending Products</h1>
        <p class="text-center text-gray-500 mb-6">Fetching real-time trends from the backend API.</p>
        
        <button id="run-button" onclick="fetchData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 transform hover:scale-105 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            Get Trending Products
        </button>

        <div id="results" class="mt-8 space-y-4">
            <p class="text-center text-gray-500">Click the button to fetch data from the backend...</p>
        </div>
    </div>

    <script>
        /**
         * Fetches data from the backend API and renders the results.
         */
        async function fetchData() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-center text-gray-500">Loading data...</p>';
            
            try {
                // Make the API call to your backend server
                const response = await fetch('http://127.0.0.1:8000/trending-products');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const products = await response.json();
                
                // Render the results
                renderResults(products);
                
            } catch (error) {
                console.error("Failed to fetch trending products:", error);
                resultsDiv.innerHTML = `<p class="text-center text-red-500">Error: Could not connect to the backend API. Please ensure the server is running.</p>`;
            }
        }

        /**
         * Renders the product results in the UI.
         * @param {Array<Object>} products - The products to display.
         */
        function renderResults(products) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; // Clear previous results

            if (products.length === 0) {
                resultsDiv.innerHTML = '<p class="text-center text-gray-500">No products found.</p>';
                return;
            }

            products.forEach(p => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'p-4 rounded-xl shadow-sm border border-gray-200 transition duration-200 ease-in-out';
                
                let signalColor = '';
                switch (p.signal) {
                    case 'BREAKOUT':
                        signalColor = 'bg-red-500';
                        break;
                    case 'MOMENTUM':
                        signalColor = 'bg-yellow-500';
                        break;
                    case 'STEADY':
                        signalColor = 'bg-green-500';
                        break;
                    case 'COOLING':
                        signalColor = 'bg-blue-500';
                        break;
                    default:
                        signalColor = 'bg-gray-400';
                }

                itemDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-lg font-bold text-gray-900">${p.product_id}</h3>
                        <span class="text-xs font-semibold px-2 py-1 rounded-full text-white ${signalColor}">${p.signal}</span>
                    </div>
                    <div class="text-sm text-gray-600 space-y-1">
                        <p><strong>Units Sold (24h):</strong> ${p.units_24h.toFixed(0)}</p>
                        <p><strong>Views (24h):</strong> ${p.views_24h.toFixed(0)}</p>
                        <p><strong>Likes (24h):</strong> ${p.likes_24h.toFixed(0)}</p>
                        <p><strong>Trend Score:</strong> ${p.TrendScore.toFixed(2)}</p>
                    </div>
                `;
                resultsDiv.appendChild(itemDiv);
            });
        }
    </script>
</body>
</html>
